name: garden_timelapse
description: "Track your garden's change over time: daily timed photos with an onion-skin FOV guide, per-day notes, and a timelapse video export."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Persistence
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Camera
  camera: ^0.10.5+5

  # Notifications / scheduling
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2

  # Permissions
  permission_handler: ^11.3.1

  # Video export
  ffmpeg_kit_flutter: ^6.0.0

  # Utilities
  intl: ^0.19.0
  share_plus: ^9.0.0
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ffmpeg_kit_flutter 6.0.3 is the latest release on pub.dev and is stale: its
# Android plugin still references the v1-embedding PluginRegistry.Registrar,
# which Flutter 3.47 removed, so it no longer compiles. We vendor a patched
# copy (v1 code stripped, otherwise identical) under local_plugins/.
# TODO: drop the override when arthenica ships a Flutter 3.47-compatible release.
dependency_overrides:
  ffmpeg_kit_flutter:
    path: local_plugins/ffmpeg_kit_flutter

flutter:
  uses-material-design: true
